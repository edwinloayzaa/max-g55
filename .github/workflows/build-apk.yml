name: Build APK

on:
  push:
    paths:
      - 'MaxG55Remote.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Descomprimir y compilar
        run: |
          unzip -q MaxG55Remote.zip
          cd MaxG55Remote
          gradle assembleDebug --no-daemon

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            MaxG55Remote/app/build/outputs/apk/debug/app-debug.apk \
            --title "APK ${{ github.run_number }}" \
            --notes "APK de depuracion Control MAX-G55"
